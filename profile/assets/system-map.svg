<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 940" width="1220" height="940" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tayel AI Labs Courses: system map, beginner to expert</title>
  <style>
    .bg { fill: #0b1020; }
    .box { fill: #111a2e; stroke-width: 1.6; }
    .t { fill: #f1f5f9; font-size: 14px; font-weight: 700; }
    .s { fill: #94a3b8; font-size: 12.5px; }
    .lvl { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .lvlname { fill: #f1f5f9; font-size: 17px; font-weight: 700; }
    .colh { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-anchor: middle; }
    .a { stroke: #60a5fa; } .b { stroke: #a78bfa; } .c { stroke: #fbbf24; } .d { stroke: #f472b6; } .e { stroke: #34d399; }
    .fa { fill: #60a5fa; } .fb { fill: #a78bfa; } .fc { fill: #fbbf24; } .fd { fill: #f472b6; } .fe { fill: #34d399; }

    .flow { fill: none; stroke-width: 2.2; stroke-dasharray: 6 7; animation: flow 1.2s linear infinite, fade .6s ease 1.6s both; }
    .flow.long { stroke-dasharray: 3 9; opacity: .8; }
    @keyframes flow { to { stroke-dashoffset: -26; } }

    .row { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .r0 { animation-delay: .1s; } .r1 { animation-delay: .3s; } .r2 { animation-delay: .5s; }
    .r3 { animation-delay: .7s; } .r4 { animation-delay: .9s; } .r5 { animation-delay: 1.1s; } .r6 { animation-delay: 1.3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .cap { animation: glow 2.6s ease-in-out 1.8s infinite; }
    @keyframes glow { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    .dot { animation: fade .6s ease 1.8s both; }
  </style>

  <defs>
    <linearGradient id="capg" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset=".35" stop-color="#a78bfa"/>
      <stop offset=".7" stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1220" height="940" rx="18"/>

  <!-- header -->
  <g class="row r0">
    <text x="24" y="48" fill="#f1f5f9" font-size="26" font-weight="800">Tayel AI Labs Courses · System Map</text>
    <text x="24" y="76" fill="#94a3b8" font-size="14">Beginner to expert across 12 live repos. Follow a column down; every arrow is "take this next".</text>
    <text class="colh fa" x="250" y="128">AI CORE</text>
    <text class="colh fb" x="462" y="128">APPLIED AI</text>
    <text class="colh fc" x="674" y="128">HARDWARE</text>
    <text class="colh fd" x="886" y="128">PRODUCT</text>
    <text class="colh fe" x="1098" y="128">CONTESTS</text>
  </g>

  <!-- arrows (drawn under the boxes) -->
  <g marker-end="url(#ah)">
    <path class="flow a" d="M250,234 V268"/><path class="flow a" d="M250,354 V388"/>
    <path class="flow a" d="M250,474 V508"/><path class="flow a" d="M250,594 V628"/>
    <path class="flow a" d="M250,714 V748"/>
    <path class="flow long b" d="M462,234 V508"/><path class="flow b" d="M462,594 V628"/>
    <path class="flow c" d="M674,354 V388"/><path class="flow c" d="M674,474 V508"/>
    <path class="flow c" d="M674,594 V628"/><path class="flow c" d="M674,714 V748"/>
    <path class="flow d" d="M886,474 V508"/><path class="flow long d" d="M886,594 V748"/>
    <path class="flow e" d="M1098,354 V388"/><path class="flow long e" d="M1098,474 V748"/>
  </g>

  <!-- travelling pulses -->
  <g class="dot">
    <circle r="4.5" class="fa"><animateMotion dur="3.6s" repeatCount="indefinite" path="M250,234 V750"/></circle>
    <circle r="4.5" class="fb"><animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M462,234 V630"/></circle>
    <circle r="4.5" class="fc"><animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M674,354 V750"/></circle>
    <circle r="4.5" class="fd"><animateMotion dur="2.4s" begin="0.3s" repeatCount="indefinite" path="M886,474 V750"/></circle>
    <circle r="4.5" class="fe"><animateMotion dur="3s" begin="0.9s" repeatCount="indefinite" path="M1098,354 V750"/></circle>
  </g>

  <!-- L0 -->
  <g class="row r1">
    <text class="lvl fa" x="24" y="186">LEVEL 0</text><text class="lvlname" x="24" y="208">Beginner</text>
    <rect class="box a" x="150" y="150" width="200" height="84" rx="10"/>
    <text class="t" x="164" y="176">Advanced-AI · Block 0</text>
    <text class="s" x="164" y="198">Python, Foundations,</text><text class="s" x="164" y="216">Databases &amp; SQL</text>
    <rect class="box b" x="362" y="150" width="200" height="84" rx="10"/>
    <text class="t" x="376" y="176">Claude-Skills 00-02</text>
    <text class="s" x="376" y="198">+ Prompt-Eng 00-03</text><text class="s" x="376" y="216">setup, models, first prompts</text>
  </g>

  <!-- L1 -->
  <g class="row r2">
    <text class="lvl fa" x="24" y="306">LEVEL 1</text><text class="lvlname" x="24" y="328">Junior</text>
    <rect class="box a" x="150" y="270" width="200" height="84" rx="10"/>
    <text class="t" x="164" y="296">Advanced-AI · Block 1</text>
    <text class="s" x="164" y="318">Machine Learning</text><text class="s" x="164" y="336">Deep Learning</text>
    <rect class="box c" x="574" y="270" width="200" height="84" rx="10"/>
    <text class="t" x="588" y="296">IOT</text>
    <text class="s" x="588" y="318">sensors, the 4 layers,</text><text class="s" x="588" y="336">gateways, PID control</text>
    <rect class="box e" x="998" y="270" width="200" height="84" rx="10"/>
    <text class="t" x="1012" y="296">Competitive-Prog 01</text>
    <text class="s" x="1012" y="318">C++ for Python devs,</text><text class="s" x="1012" y="336">STL, stress testing</text>
  </g>

  <!-- L2 -->
  <g class="row r3">
    <text class="lvl fa" x="24" y="426">LEVEL 2</text><text class="lvlname" x="24" y="448">Intermediate</text>
    <rect class="box a" x="150" y="390" width="200" height="84" rx="10"/>
    <text class="t" x="164" y="416">Advanced-AI · Blocks 2-3</text>
    <text class="s" x="164" y="438">NLP, CV, Time Series, Audio</text><text class="s" x="164" y="456">Data Engineering &amp; Analysis</text>
    <rect class="box c" x="574" y="390" width="200" height="84" rx="10"/>
    <text class="t" x="588" y="416">PLC-ladder-logic</text>
    <text class="s" x="588" y="438">contacts, timers, counters,</text><text class="s" x="588" y="456">interlocks, water tank</text>
    <rect class="box d" x="786" y="390" width="200" height="84" rx="10"/>
    <text class="t" x="800" y="416">AI-in-UIUX</text>
    <text class="s" x="800" y="438">design the interface of an</text><text class="s" x="800" y="456">AI automation tool (n8n)</text>
    <rect class="box e" x="998" y="390" width="200" height="84" rx="10"/>
    <text class="t" x="1012" y="416">Competitive-Prog 02</text>
    <text class="s" x="1012" y="438">binary search, graphs,</text><text class="s" x="1012" y="456">DSU, DP, number theory</text>
  </g>

  <!-- L3 -->
  <g class="row r4">
    <text class="lvl fa" x="24" y="546">LEVEL 3</text><text class="lvlname" x="24" y="568">Advanced</text>
    <rect class="box a" x="150" y="510" width="200" height="84" rx="10"/>
    <text class="t" x="164" y="536">Advanced-AI · Blocks 4-5</text>
    <text class="s" x="164" y="558">Data Science, Practical AI</text><text class="s" x="164" y="576">LLMs &amp; GenAI, AI Agents</text>
    <rect class="box b" x="362" y="510" width="200" height="84" rx="10"/>
    <text class="t" x="376" y="536">Adv-Prompt-Eng 04-14</text>
    <text class="s" x="376" y="558">CoT, RAG, agents, evals</text><text class="s" x="376" y="576">+ Claude-Skills 03-08</text>
    <rect class="box c" x="574" y="510" width="200" height="84" rx="10"/>
    <text class="t" x="588" y="536">Intro-To-Robotics</text>
    <text class="s" x="588" y="558">frames, transforms,</text><text class="s" x="588" y="576">DH, forward kinematics</text>
    <rect class="box d" x="786" y="510" width="200" height="84" rx="10"/>
    <text class="t" x="800" y="536">AI-in-Frontend</text>
    <text class="s" x="800" y="558">build that UI for real</text><text class="s" x="800" y="576">on live n8n webhooks</text>
  </g>

  <!-- L4 -->
  <g class="row r5">
    <text class="lvl fa" x="24" y="666">LEVEL 4</text><text class="lvlname" x="24" y="688">Senior</text>
    <rect class="box a" x="150" y="630" width="200" height="84" rx="10"/>
    <text class="t" x="164" y="656">Advanced-AI · Blocks 6-7</text>
    <text class="s" x="164" y="678">MLOps, System Design, HPC</text><text class="s" x="164" y="696">Optimization, Security, RL</text>
    <rect class="box b" x="362" y="630" width="200" height="84" rx="10"/>
    <text class="t" x="376" y="656">Cloud + Cyber</text>
    <text class="s" x="376" y="678">Cloud-Computing: AWS, VPC</text><text class="s" x="376" y="696">Cyber-Ai: AI for security</text>
    <rect class="box c" x="574" y="630" width="200" height="84" rx="10"/>
    <text class="t" x="588" y="656">Embedded-AI</text>
    <text class="s" x="588" y="678">TinyML, Edge Impulse,</text><text class="s" x="588" y="696">3 robot projects</text>
  </g>

  <!-- L5 -->
  <g class="row r6">
    <text class="lvl fa" x="24" y="786">LEVEL 5</text><text class="lvlname" x="24" y="808">Expert</text>
    <rect class="box cap" x="150" y="750" width="836" height="84" rx="10" stroke="url(#capg)" stroke-width="2.4"/>
    <text class="t" x="168" y="778" font-size="16">Capstones · Advanced-AI Final-Projects</text>
    <text class="s" x="168" y="802" font-size="13.5">A · a decision system      B · the assistant      C · an efficient model</text>
    <text class="s" x="168" y="822">each one pulls together 10+ courses from the levels above</text>
    <rect class="box e" x="998" y="750" width="200" height="84" rx="10"/>
    <text class="t" x="1012" y="776">Competitive-Prog 03</text>
    <text class="s" x="1012" y="798">segment trees, flows,</text><text class="s" x="1012" y="816">ECPC-Prep virtual rounds</text>

    <rect x="150" y="866" width="1048" height="46" rx="10" fill="none" stroke="#475569" stroke-dasharray="4 5"/>
    <text x="168" y="894" fill="#cbd5e1" font-size="13.5"><tspan font-weight="700" fill="#f1f5f9">At every level: </tspan>Communication &amp; Docs · AI Governance · Research &amp; Review  (Advanced-AI Block 8, start in week one)</text>
  </g>
</svg>
